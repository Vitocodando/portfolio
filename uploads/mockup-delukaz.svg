<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dlkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070809" />
      <stop offset="50%" stop-color="#0E1013" />
      <stop offset="100%" stop-color="#050607" />
    </linearGradient>
    <linearGradient id="dlkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B774" />
      <stop offset="100%" stop-color="#F6E0B5" />
    </linearGradient>
    <linearGradient id="dlkCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15181C" />
      <stop offset="100%" stop-color="#0D0F12" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#dlkBg)" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="180" r="280" fill="#E2B774" opacity="0.06" filter="url(#goldGlow)" />
  <circle cx="200" cy="500" r="200" fill="#7CF29C" opacity="0.04" filter="url(#goldGlow)" />

  <!-- Laptop / Browser Showcase Frame -->
  <g transform="translate(100, 40)">
    <!-- Main Window -->
    <rect width="1000" height="580" rx="16" fill="#0A0C0E" stroke="#22272E" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect width="1000" height="46" rx="16" fill="#111418" />
    <rect y="30" width="1000" height="16" fill="#111418" />
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#22272E" stroke-width="1" />
    
    <!-- Window Dots -->
    <circle cx="28" cy="23" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="60" cy="23" r="5" fill="#10B981" opacity="0.8" />
    
    <!-- Browser URL -->
    <rect x="180" y="9" width="640" height="28" rx="6" fill="#08090B" stroke="#1A1E24" stroke-width="1" />
    <text x="320" y="27" fill="#E2B774" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">https://</text>
    <text x="375" y="27" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">delukaz-portfolio.vercel.app</text>

    <!-- Studio Nav Inside Page -->
    <g transform="translate(48, 64)">
      <text x="0" y="24" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" letter-spacing="0.1em">DELUKAZ</text>
      <text x="96" y="24" fill="#E2B774" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.15em">STUDIO</text>
      
      <!-- Nav Links -->
      <text x="540" y="22" fill="#E2B774" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Início</text>
      <text x="600" y="22" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="12">Galeria</text>
      <text x="668" y="22" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="12">Artistas</text>
      <text x="736" y="22" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="12">Cuidados</text>
      <rect x="804" y="4" width="100" height="28" rx="6" fill="url(#dlkGold)" />
      <text x="818" y="22" fill="#0A0C0E" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Orçamento ↗</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(48, 128)">
      <rect x="0" y="0" width="140" height="20" rx="4" fill="#1C1810" stroke="#3A301E" stroke-width="1" />
      <text x="10" y="14" fill="#E2B774" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TATTOO &amp; PIERCING</text>
      
      <text x="0" y="56" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">Arte autoral, precisão</text>
      <text x="0" y="94" fill="url(#dlkGold)" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">&amp; identidade na sua pele.</text>
      
      <text x="0" y="126" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="13" max-width="400">Ambiente exclusivo com biossegurança rigorosa, traços finos, blackwork e realismo.</text>
    </g>

    <!-- Gallery Grid Preview inside the studio showcase -->
    <g transform="translate(48, 290)">
      <text x="0" y="0" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Trabalhos em Destaque</text>
      
      <!-- Filter chips -->
      <rect x="180" y="-14" width="60" height="20" rx="10" fill="#E2B774" />
      <text x="194" y="0" fill="#0A0C0E" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Todos</text>
      
      <rect x="250" y="-14" width="76" height="20" rx="10" fill="#13171C" stroke="#252C36" stroke-width="1" />
      <text x="260" y="0" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="10">Blackwork</text>

      <rect x="334" y="-14" width="70" height="20" rx="10" fill="#13171C" stroke="#252C36" stroke-width="1" />
      <text x="344" y="0" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="10">Fine Line</text>

      <rect x="412" y="-14" width="70" height="20" rx="10" fill="#13171C" stroke="#252C36" stroke-width="1" />
      <text x="424" y="0" fill="#8B96A0" font-family="'Space Grotesk', sans-serif" font-size="10">Piercing</text>

      <!-- Gallery Cards -->
      <!-- Item 1 -->
      <g transform="translate(0, 16)">
        <rect width="210" height="190" rx="10" fill="url(#dlkCard)" stroke="#222831" stroke-width="1" />
        <rect x="10" y="10" width="190" height="130" rx="8" fill="#1B1E24" />
        <!-- Abstract Tattoo art graphic -->
        <circle cx="105" cy="75" r="38" fill="none" stroke="#E2B774" stroke-width="1.5" stroke-dasharray="4,4" />
        <polygon points="105,48 128,88 82,88" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        <circle cx="105" cy="75" r="8" fill="#E2B774" />
        <text x="14" y="160" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Geométrico &amp; Pontilhismo</text>
        <text x="14" y="174" fill="#8B96A0" font-family="'JetBrains Mono', monospace" font-size="9">Flash Exclusivo · Blackwork</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(230, 16)">
        <rect width="210" height="190" rx="10" fill="url(#dlkCard)" stroke="#222831" stroke-width="1" />
        <rect x="10" y="10" width="190" height="130" rx="8" fill="#1B1E24" />
        <path d="M 80 100 Q 105 40 130 100 Q 105 80 80 100 Z" fill="none" stroke="#E2B774" stroke-width="2" />
        <circle cx="105" cy="65" r="4" fill="#FFFFFF" />
        <text x="14" y="160" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Floral Fine Line</text>
        <text x="14" y="174" fill="#8B96A0" font-family="'JetBrains Mono', monospace" font-size="9">Traço Fino · 03RL</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(460, 16)">
        <rect width="210" height="190" rx="10" fill="url(#dlkCard)" stroke="#222831" stroke-width="1" />
        <rect x="10" y="10" width="190" height="130" rx="8" fill="#1B1E24" />
        <!-- Dragon / Oriental wave graphic -->
        <path d="M 60 85 Q 85 55 110 85 T 150 85" fill="none" stroke="#FFFFFF" stroke-width="2" />
        <path d="M 70 70 Q 95 40 120 70 T 140 70" fill="none" stroke="#E2B774" stroke-width="1.5" />
        <text x="14" y="160" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Oriental Neo Traditional</text>
        <text x="14" y="174" fill="#8B96A0" font-family="'JetBrains Mono', monospace" font-size="9">Arte de Fechamento</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(690, 16)">
        <rect width="210" height="190" rx="10" fill="url(#dlkCard)" stroke="#222831" stroke-width="1" />
        <rect x="10" y="10" width="190" height="130" rx="8" fill="#1B1E24" />
        <circle cx="105" cy="75" r="26" fill="none" stroke="#E2B774" stroke-width="2" />
        <circle cx="105" cy="50" r="5" fill="#E2B774" />
        <text x="14" y="160" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Piercing Titânio G23</text>
        <text x="14" y="174" fill="#8B96A0" font-family="'JetBrains Mono', monospace" font-size="9">Aplicação Asséptica</text>
      </g>
    </g>
  </g>
</svg>
