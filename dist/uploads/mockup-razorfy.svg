      <text x="12" y="162" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Combo Cabelo + Barba</text>
      <text x="12" y="178" fill="#8B9B94" font-family="'JetBrains Mono', monospace" font-size="10">R$ 70,00 · 60 min</text>
