<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0A" />
      <stop offset="50%" stop-color="#0D1210" />
      <stop offset="100%" stop-color="#060908" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B18" />
      <stop offset="100%" stop-color="#0F1513" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CF29C" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CF29C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7CF29C" stop-opacity="0.0" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="260" fill="#7CF29C" opacity="0.07" filter="url(#emeraldGlow)" />
  <circle cx="950" cy="400" r="220" fill="#38BDF8" opacity="0.05" filter="url(#emeraldGlow)" />

